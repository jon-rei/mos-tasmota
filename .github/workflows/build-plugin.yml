name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Lint poll script
        run: shellcheck bin/tasmota-energy-query

      - name: Build Vue plugin
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm ci && npm run build

      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PKG_DIR="tasmota-energy-${VERSION}-1+mos-plugin_all"
          DEB_FILE="tasmota-energy-${VERSION}-1+mos-plugin_all.deb"

          mkdir -p ${PKG_DIR}/var/www/mos-plugins/tasmota-energy ${PKG_DIR}/usr/bin/plugins ${PKG_DIR}/DEBIAN
          cp -R page/dist/tasmota-energy/* ${PKG_DIR}/var/www/mos-plugins/tasmota-energy/
          cp bin/tasmota-energy-query ${PKG_DIR}/usr/bin/plugins/tasmota-energy-query
          chmod 755 ${PKG_DIR}/usr/bin/plugins/tasmota-energy-query

          cat > ${PKG_DIR}/DEBIAN/control << CONTROL
          Package: tasmota-energy
          Version: ${VERSION}-1+mos-plugin
          Section: utils
          Priority: optional
          Architecture: all
          Depends: bash, curl, jq
          Maintainer: jon-rei <21036205+jon-rei@users.noreply.github.com>
          Description: Tasmota Energy Monitor plugin for MOS
           Installs the tasmota-energy-query script (/usr/bin/plugins) and the
           built plugin frontend (var/www/mos-plugins/tasmota-energy) for the
           Tasmota Energy Monitor MOS plugin, which shows energy consumption of
           Tasmota devices on the MOS dashboard.
          CONTROL

          dpkg-deb --root-owner-group --build ${PKG_DIR} ${DEB_FILE}
          md5sum ${DEB_FILE} | awk '{print $1}' > ${DEB_FILE}.md5

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: |
            tasmota-energy-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb
            tasmota-energy-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb.md5
